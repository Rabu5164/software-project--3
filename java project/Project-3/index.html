<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-title">
                <h1>Guessing Game</h1>
            </div>

            <!-- Corrected 'form' tag -->
            <form>
                <div class="card-body">
                    <div class="form-field">
                        <label for="guessingNumber">Guess a number between 1-5:</label>
                        <input type="number" id="guessingNumber" min="1" max="5" placeholder="Enter a number" required>
                    </div>
                    <div class="buttons">
                        <button id="check" type="submit" class="btn">Check Result</button>
                    </div>
                    <p class="resultText"></p>
                    <p class="remainingAttempts"></p>
                </div>
            </form>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
